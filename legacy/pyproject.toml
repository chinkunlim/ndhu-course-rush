[project]
name = "ndhu-course-selector"
version = "1.0.0"
description = "National Dong Hwa University (NDHU) Course Selection Automation & Inspection System"
readme = "README.md"
authors = [
    { name = "NDHU Course Selector Team" }
]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.40.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
ndhu-course-selector = "ndhu_course_selector.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ndhu_course_selector"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
